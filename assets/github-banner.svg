<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#120924"/>
    </linearGradient>

    <!-- Glowing Orb Gradients (Blue -> Purple -> Pink) -->
    <radialGradient id="blueGlow" cx="25%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pinkGlow" cx="78%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Border & Accent Line Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <!-- Text Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .banner-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: 5px;
      fill: #ffffff;
      text-anchor: middle;
    }
    .banner-subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3.5px;
      fill: #e2e8f0;
      text-anchor: middle;
    }
    .accent-tag {
      font-family: 'Fira Code', Consolas, monospace;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #a855f7;
      text-anchor: middle;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)"/>

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="280" rx="16" fill="url(#cyberGrid)"/>

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="280" rx="16" fill="url(#blueGlow)"/>
  <rect width="1200" height="280" rx="16" fill="url(#purpleGlow)"/>
  <rect width="1200" height="280" rx="16" fill="url(#pinkGlow)"/>

  <!-- Subtle Cyber Corner Accents -->
  <path d="M 28 44 L 28 28 L 44 28" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  <path d="M 1172 44 L 1172 28 L 1156 28" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.6"/>
  <circle cx="28" cy="28" r="2" fill="#3b82f6"/>
  <circle cx="1172" cy="28" r="2" fill="#ec4899"/>

  <!-- Central Visual Pill (System Indicator) -->
  <rect x="510" y="46" width="180" height="24" rx="12" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
  <circle cx="528" cy="58" r="4" fill="#a855f7"/>
  <text x="605" y="62" class="accent-tag">DEV // SECURITY</text>

  <!-- Primary Name / Title -->
  <text x="600" y="128" class="banner-title" filter="url(#glow)">JAYAKUMAR M</text>

  <!-- Subtitle -->
  <text x="600" y="172" class="banner-subtitle">CYBER SECURITY • JAVA DEVELOPER • AI / ML &amp; RAG</text>

  <!-- Horizontal Tech Divider -->
  <line x1="420" y1="202" x2="780" y2="202" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="600" cy="202" r="3.5" fill="#a855f7"/>

  <!-- Bottom Wave-like Gradient Horizon -->
  <path d="M 0 252 Q 300 236 600 254 T 1200 248 L 1200 280 L 0 280 Z" fill="rgba(15, 23, 42, 0.55)"/>
  <path d="M 0 260 Q 300 246 600 262 T 1200 256 L 1200 280 L 0 280 Z" fill="rgba(124, 58, 237, 0.15)"/>
  <path d="M 0 252 Q 300 236 600 254 T 1200 248" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.85"/>

  <!-- Outer Rounded Border -->
  <rect x="1" y="1" width="1198" height="278" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" stroke-opacity="0.35"/>
</svg>
